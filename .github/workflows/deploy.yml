name: Deploy to GitHub Pages

# 触发条件：
# - 推 main 分支 → 构建并部署到 GitHub Pages
# - 其它分支 / PR → 只跑构建检查，不部署
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 部署需要写 Pages 权限；PR 只读即可
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支的新 push 取消上一次未完成的部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build
        # Pages 项目站点在 /<repo>/ 子路径下，base 需要带上仓库名
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    # 只有 main 分支的推送才部署；PR 只跑上面的构建检查
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
